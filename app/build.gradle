apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    buildToolsVersion "33.0.1"
    namespace "com.example.tlstest"

    defaultConfig {
        applicationId "com.example.tlstest"
        minSdkVersion 18
        targetSdkVersion 19
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // آخرین نسخه‌ی OkHttp که هنوز از Android 4.x (API 18+) پشتیبانی می‌کنه
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // Conscrypt: موتور TLS مستقل که کاملاً جدا از سیستم عامل کار می‌کنه
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
}
